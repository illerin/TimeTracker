<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Export — Time Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
      color: #222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }
    h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
    .back-link { margin-bottom: 1.5rem; }
    .back-link a { color: #2563eb; text-decoration: none; font-size: 0.95rem; }
    .back-link a:hover { text-decoration: underline; }

    .export-card {
      background: #fff;
      border-radius: 8px;
      padding: 2rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    .field { margin-bottom: 1.2rem; }
    .field label { display: block; font-weight: 600; margin-bottom: 0.4rem; font-size: 0.95rem; }
    .field input[type="date"], .field input[type="text"], .field select {
      width: 100%;
      padding: 0.45rem 0.6rem;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-size: 1rem;
    }
    .project-list {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      max-height: 220px;
      overflow-y: auto;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 0.65rem;
      background: #f9fafb;
    }
    .project-list label {
      display: flex;
      gap: 0.45rem;
      align-items: center;
      font-weight: 400;
      font-size: 0.95rem;
    }

    .button-row {
      display: flex;
      gap: 0.75rem;
    }
    button {
      width: 100%;
      padding: 0.65rem;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #2563eb;
      color: #fff;
      margin-top: 0.5rem;
    }
    button:hover { background: #1d4ed8; }

    .alert {
      background: #fee2e2;
      color: #991b1b;
      border-radius: 6px;
      padding: 0.7rem 1rem;
      margin-bottom: 1rem;
      display: none;
      font-size: 0.9rem;
    }
    .alert.visible { display: block; }
  </style>
</head>
<body>
  <h1>Export Data</h1>
  <div class="back-link"><a href="index.html">&#8592; Back to main</a></div>

  <div class="export-card">
    <div class="alert" id="export-error" role="alert"></div>

    <div class="field">
      <label for="export-start">Start Date</label>
      <input type="date" id="export-start" />
    </div>
    <div class="field">
      <label for="export-end">End Date</label>
      <input type="date" id="export-end" />
    </div>
    <div class="field">
      <label for="invoice-number">Invoice #</label>
      <input type="text" id="invoice-number" placeholder="230" />
    </div>
    <div class="field">
      <label for="invoice-date">Invoice Date</label>
      <input type="date" id="invoice-date" />
    </div>
    <div class="field">
      <label for="from-profile">From</label>
      <select id="from-profile"></select>
    </div>
    <div class="field">
      <label for="to-profile">To</label>
      <select id="to-profile"></select>
    </div>
    <div class="field">
      <label>Rate Mode</label>
      <div style="display:flex;gap:1rem;align-items:center;font-size:0.95rem;">
        <label style="display:flex;gap:0.35rem;align-items:center;font-weight:400;margin:0;">
          <input type="radio" name="export-rate-mode" value="project" checked />
          By project
        </label>
        <label style="display:flex;gap:0.35rem;align-items:center;font-weight:400;margin:0;">
          <input type="radio" name="export-rate-mode" value="standard" />
          Standard rate
        </label>
      </div>
    </div>
    <div class="field" id="standard-rate-field" style="display:none;">
      <label for="standard-rate">Standard Rate</label>
      <select id="standard-rate"></select>
    </div>
    <div class="field">
      <label for="signature-select">PDF Signature</label>
      <select id="signature-select"></select>
    </div>
    <div class="field">
      <label>Projects</label>
      <div style="color:#6b7280;font-size:0.85rem;margin-bottom:0.4rem;">Hours update from the selected date range.</div>
      <div id="export-projects" class="project-list">
        <span style="color:#6b7280;font-size:0.9rem;">Loading projects...</span>
      </div>
    </div>
    <div class="field">
      <label style="display:flex;gap:0.45rem;align-items:center;font-weight:400;">
        <input type="checkbox" id="include-expenses" />
        Include expenses
      </label>
    </div>

    <div class="button-row">
      <button id="btn-export-xlsx">Export Excel</button>
      <button id="btn-export-pdf">Export PDF</button>
    </div>
    <div class="button-row">
      <button id="btn-preview-pdf" type="button">Preview PDF</button>
    </div>
  </div>

  <script src="js/export.js"></script>
</body>
</html>
