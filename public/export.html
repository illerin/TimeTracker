<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Export — Time Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
      color: #222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }
    h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
    .back-link { margin-bottom: 1.5rem; }
    .back-link a { color: #2563eb; text-decoration: none; font-size: 0.95rem; }
    .back-link a:hover { text-decoration: underline; }

    .export-card {
      background: #fff;
      border-radius: 8px;
      padding: 2rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    .field { margin-bottom: 1.2rem; }
    .field label { display: block; font-weight: 600; margin-bottom: 0.4rem; font-size: 0.95rem; }
    .field input[type="date"] {
      width: 100%;
      padding: 0.45rem 0.6rem;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-size: 1rem;
    }

    button {
      width: 100%;
      padding: 0.65rem;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #2563eb;
      color: #fff;
      margin-top: 0.5rem;
    }
    button:hover { background: #1d4ed8; }

    .alert {
      background: #fee2e2;
      color: #991b1b;
      border-radius: 6px;
      padding: 0.7rem 1rem;
      margin-bottom: 1rem;
      display: none;
      font-size: 0.9rem;
    }
    .alert.visible { display: block; }
  </style>
</head>
<body>
  <h1>Export Data</h1>
  <div class="back-link"><a href="index.html">&#8592; Back to main</a></div>

  <div class="export-card">
    <div class="alert" id="export-error" role="alert"></div>

    <div class="field">
      <label for="export-start">Start Date</label>
      <input type="date" id="export-start" />
    </div>
    <div class="field">
      <label for="export-end">End Date</label>
      <input type="date" id="export-end" />
    </div>

    <button id="btn-export">Export to Excel</button>
  </div>

  <script src="js/export.js"></script>
</body>
</html>
